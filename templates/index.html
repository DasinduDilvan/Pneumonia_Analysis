<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pneumonia X-Ray Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, sans-serif;
            background-color: #1a1f2e;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .headermain{
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        .titlemain{
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #e0e7ff;
            text-align: center;
            max-width: 600px;
        }

        .upload-section{
            background-color: #374151;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(25, 155, 255, 0.3);
        }
        .upload-text h3{
            margin-bottom: 5px;
            color: #60a5fa;
        }
        .upload-text p{
            margin-bottom: 15px;
            color: #9ca3af;
        }

        input[type="file"] {
            margin-bottom: 10px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #10b981;
            color: white;
            cursor: pointer;
            font-size: 1em;
            transition: 1s;
        }
        button:hover {
            transition: 1s;
            background-color: #059669;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }
        #result, #confidence {
            margin-top: 20px;
            font-size: 1.2em;
        }
        #confidence {
            color: #fbbf24;
        }
        #result {
            color: #34d399;
        }
        .result-item {
            background-color: #374151;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            width: 100%;
            max-width: 440px;
            align-items: center;
            justify-content: center;
            justify-items: center;
        }
        
        .results-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .results-icon {
            font-size: 2em;
            margin-right: 10px;
        }
        .preview-container {
            width: 300px;
            height: 300px;           /* fixed height */
            border: 2px dashed #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            margin-top: 10px;
        }       
        .image-preview {
            max-width: 100%;
            max-height: 100%;     
            object-fit: contain; 
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }
        input[type="file"] {
            width: auto;
            height: auto;
            max-width: 300px;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            max-width: 300px;
        }
        .analysis_but {
            background-color: #3b82f6;
            justify-content: center;
            align-items: center;
            transition: 1s;
        }
        .analysis_but:hover {
            background-color: #2563eb;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            transition: 1s;
        }
        .social-links {
            margin-top: 10px;
        }
        .social-link {
            margin: 0 10px;
            color: #6b7280;
            text-decoration: none;
        }
        .social-link img {
            width: 24px;
            height: 24px;
            filter: invert(70%) sepia(10%) saturate(500%) hue-rotate(180deg) brightness(90%) contrast(85%);
            transition: filter 0.3s;
        }
        .social-link img:hover {
            filter: invert(50%) sepia(100%) saturate(500%) hue-rotate(150deg) brightness(110%) contrast(120%);
        }
        .footer {
            text-align: bottom;
            padding: 2rem 0;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            margin-top: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

    </style>
</head>
<body>
    <br>
    <h1 class="headermain">Pneumonia X-Ray Analysis</h1>
    <br><br>
    <h3 class="titlemain">AI-powered pneumonia detection from chest X-ray images. Upload your X-ray for instant analysis.</h3>
    <br>
    <div class="upload-section">
                <div class="upload-text">
                    <h3>Upload X-Ray Image</h3>
                    <br>
                    <p>Select your X-ray image here, or click to browse</p>
                    <br>
                    <button class="upload-btn" onclick="event.stopPropagation(); document.getElementById('fileInput').click()">
                        Choose File
                    </button>
                    <input type="file" id="fileInput" accept="image/*" style="display:none;">
        </div>
    </div>
    <div class="result-section">
        <div id="result"></div>
        <div id="confidence"></div>
    </div>

    <div class="result-item" id="resultItem" style="display: none;">
        <div class="results-header">
            <h2>Preview Image</h2>
        </div>
    
        <div class="preview-container">
            <br><br>
            <center>
                <img id="imagePreview" class="image-preview" alt="X-ray preview">
            </center>
        </div>
        <br><center>
        <button class="analysis_but" onclick="location.reload();">Analyse the image</button>
        <br></center><br>
    
    </div> 



     <footer class="footer">
            <p>© 2025 Pneumonia X-Ray Analysis System. For medical research purposes only.</p>
            <div class="social-links">
                <a href="https://github.com/DasinduDilvan/Pneumonia_Analysis" target="_blank" class="social-link">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" alt="GitHub">
                </a>
                <a href="https://www.linkedin.com/in/dasindu-dilvan-13a696379/" target="_blank" class="social-link">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg" alt="LinkedIn">
                </a>
            </div>
        </footer>

    
        <script>

            const fileInput = document.getElementById("fileInput");
const imagePreview = document.getElementById("imagePreview");
const resultItem = document.getElementById("resultItem");

fileInput.addEventListener("change", function () {
    const file = this.files[0];
    if (!file) return;

    if (!file.type.startsWith("image/")) {
        
        this.value = "";    
        imagePreview.src = "";   
        resultItem.style.display = "none"; 
        return;
    }

    // Show preview
    const reader = new FileReader();
    reader.onload = function (e) {
        imagePreview.src = e.target.result;
        resultItem.style.display = "block";
    };
    reader.readAsDataURL(file);

    // Send to backend
    const formData = new FormData();
    formData.append("file", file);

    fetch("/upload", {
        method: "POST",
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        console.log("Server response:", data);
        // TODO: show prediction on the page later
    })
    .catch(error => console.error("Error:", error));
});


        </script>            
</body>
</html>
